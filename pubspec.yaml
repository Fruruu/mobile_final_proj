name: mood_path
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

    # Supabase (Database + Auth)
  supabase_flutter: ^2.3.0
  # State Management (MVVM)
  provider: ^6.1.1
  # API calls (Claude)
  http: ^1.1.0
  # Secure API key storage
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.0
  flutter_markdown: ^0.6.20
  intl: ^0.20.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logos/
  fonts:
    - family: FafoSans
      fonts:
        - asset: assets/fonts/Fafo Sans/Fafo Sans Regular.ttf
          weight: 400
        - asset: assets/fonts/Fafo Sans/Fafo Sans Bold.ttf
          weight: 700
    - family: FafoScript
      fonts:
        - asset: assets/fonts/Fafo Script/FafoScript-Regular.ttf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
